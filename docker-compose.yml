# 一键编排：网关(静态+反代)、Node API、PostgreSQL、Redis
# 服务器宿主机映射 PG 15434（避免与同机其他项目的 15433 冲突）；容器内 node 仍用 postgres:5432
# 本地 dev 端口 15433：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
# 进程级变量见根目录 .env（由 .env.example 复制生成）；业务配置在库表 system_config。

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    # Docker/宿主机重启后自动拉起，避免 Exited(255) 后整站躺平
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jiada_shixun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jiuan@123}
      POSTGRES_DB: ${POSTGRES_DB:-jiada_shixun}
    volumes:
      - jiada_shixun:/var/lib/postgresql/data
      - ./docs/sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-15434}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jiada_shixun} -d ${POSTGRES_DB:-jiada_shixun}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:20-bookworm-slim}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: ${PORT:-4000}
      PG_POOL_MAX: ${PG_POOL_MAX:-30}
      LIBREOFFICE_BIN: ${LIBREOFFICE_BIN:-/usr/bin/soffice}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - node_uploads:/app/uploads
    expose:
      - "4000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        WEB_BUILD_NODE_IMAGE: ${WEB_BUILD_NODE_IMAGE:-${NODE_IMAGE:-docker.1ms.run/library/node:20-bookworm-slim}}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.1ms.run/library/nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18081}:80"
    depends_on:
      - node

volumes:
  jiada_shixun:
  redisdata:
  node_uploads:
