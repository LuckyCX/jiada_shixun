# 一键编排：网关(静态+反代)、Node API、PostgreSQL、Redis
# 服务器宿主机映射 PG 15434（避免与同机其他项目的 15433 冲突）；容器内 node 仍用 postgres:5432
# 本地 dev 端口 15433：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
# 不使用仓库 .env；连接信息仅写在本文件 environment 中。业务配置在库表 system_config。

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jiada_shixun
      POSTGRES_PASSWORD: jiuan@123
      POSTGRES_DB: jiada_shixun
    volumes:
      - jiada_shixun:/var/lib/postgresql/data
      - ./docs/sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiada_shixun -d jiada_shixun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:20-bookworm-slim}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: "4000"
      PG_POOL_MAX: "30"
      LIBREOFFICE_BIN: /usr/bin/soffice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - node_uploads:/app/uploads
    expose:
      - "4000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-18081}:80"
    depends_on:
      - node

volumes:
  jiada_shixun:
  redisdata:
  node_uploads:
