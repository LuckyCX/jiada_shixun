# 一键编排：网关(静态+反代) :3000、Node API、PostgreSQL、Redis
# 宿主调试：`postgres` 映射 15433:5432，`redis` 映射 16380:6379（与 npm run dev:local 一致）
# 不使用仓库 .env；连接信息仅写在本文件 environment 中。业务配置在库表 system_config。

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jiada_shixun
      POSTGRES_PASSWORD: jiuan@123
      POSTGRES_DB: jiada_shixun
    volumes:
      - jiada_shixun:/var/lib/postgresql/data
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiada_shixun -d jiada_shixun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: "4000"
      PG_POOL_MAX: "30"
      LIBREOFFICE_BIN: /usr/bin/soffice
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - node_uploads:/app/uploads
    expose:
      - "4000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "3000:80"
    depends_on:
      - node

volumes:
  jiada_shixun:
  redisdata:
  node_uploads:
