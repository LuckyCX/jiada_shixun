server {
    listen 80;
    server_name localhost;
    # Gateway 容器内 Nginx（Dockerfile.gateway 打包进镜像）
    # 宝塔 SSL/反代请用 docs/nginx/baota-site.conf — 见 docs/nginx/部署说明.md
    # 上传/预览等接口可能需要更大 body；若外层还有宝塔/Nginx 也需同步调大
    client_max_body_size 250m;

    root /usr/share/nginx/html;
    index index.html;

    # 避免浏览器/CDN 长期缓存 HTML 导致版本不一致（JS/CSS 404）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    send_timeout 3600s;

    location /api/ {
        proxy_pass http://node:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        proxy_set_header Connection "";
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 75s;
    }

    # 上传文件（头像等）由 Node 静态目录提供，避免被 SPA 路由吞掉
    location ^~ /uploads/ {
        proxy_pass http://node:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # pdf.js worker：.mjs 在默认 mime.types 中常为 octet-stream，单独指定为 JS
    location ~ ^/assets/.+\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
