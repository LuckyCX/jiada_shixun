# 宝塔站点：cxsx.zjxu.edu.cn — 全站反代 Docker gateway（GATEWAY_PORT 默认 18081）
# 结构对齐宝塔 PHP 站点模板，便于 SSL 续签与面板识别；无 root/PHP

upstream cxsx_jiada_gateway {
    server 127.0.0.1:18081;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:80;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    server_name cxsx.zjxu.edu.cn 10.10.21.6;

    #CERT-APPLY-CHECK--START
    # 用于 SSL 证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/cxsx.zjxu.edu.cn.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/cxsx.zjxu.edu.cn/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/cxsx.zjxu.edu.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/cxsx.zjxu.edu.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;
    #SSL-END

    client_max_body_size 250m;
    send_timeout 3600s;

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location / {
        proxy_pass http://cxsx_jiada_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_set_header Connection "";
    }

    access_log /www/wwwlogs/cxsx.zjxu.edu.cn.log;
    error_log /www/wwwlogs/cxsx.zjxu.edu.cn.error.log;
}
