# 宝塔站点：cxsx.zjxu.edu.cn（未部署 SSL 时使用；HTTPS 见 baota-site.cxsx.zjxu.edu.cn.ssl.conf）

upstream cxsx_jiada_gateway {
    server 127.0.0.1:18081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cxsx.zjxu.edu.cn 10.10.21.6;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/cxsx.zjxu.edu.cn.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/cxsx.zjxu.edu.cn/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    client_max_body_size 250m;
    send_timeout 3600s;

    location ~ \.well-known {
        allow all;
    }

    location / {
        proxy_pass http://cxsx_jiada_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_set_header Connection "";
    }

    access_log /www/wwwlogs/cxsx.zjxu.edu.cn.log;
    error_log /www/wwwlogs/cxsx.zjxu.edu.cn.error.log;
}
