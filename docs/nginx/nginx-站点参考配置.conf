# =============================================================================
# 大学生创业实训平台 · Nginx 站点参考配置（统一口径）
# -----------------------------------------------------------------------------
# 用途：
#   - 宿主机/宝塔：Nginx 直接对外提供前端静态站点，同时 /api 与 /uploads 反代到 Node
#   - Docker 网关：使用 deploy/nginx/default.conf（本文末尾附完整版本）
#
# 使用前请替换：
#   - your.domain.com
#   - SSL 证书路径（若启用 HTTPS）
#   - root 为前端构建产物目录（Vite 默认 web/out）
#   - upstream jiada_api 地址：本机 Node 填 127.0.0.1:4000；Docker 网关内部勿用本文件（用 deploy/nginx/default.conf）
#
# 说明：
#   - TLS 仅建议 TLSv1.2 / TLSv1.3（不建议再开 TLSv1.1）
#   - /api/ 段落包含 SSE/流式 AI 常用项，与普通 JSON 接口兼容
#   - /uploads、/exports 为可选；若走 Node 或独立文件服务，改 proxy_pass 即可
# =============================================================================

# 若写在 http {} 块外的主配置文件内，可将 upstream 提升到与 server 同级
upstream jiada_api {
    # 单机部署：Node 监听宿主机 4000
    server 127.0.0.1:4000;
    keepalive 32;
}

# 可选：独立文件/导出服务（无则注释掉下方 location，或改为指向 jiada_api）
# upstream jiada_files {
#     server 127.0.0.1:4000;
# }

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    # 如需强制 HTTPS，取消下一行注释并配置下方 443 server
    # return 301 https://$host$request_uri;

    index index.html;
    root /www/wwwroot/your.domain.com/out;

    # 上传/预览等接口可能需要更大 body；若外层还有宝塔/Nginx 也需同步调大
    client_max_body_size 250m;

    # 避免浏览器/CDN 长期缓存 HTML 导致版本不一致（JS/CSS 404）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    send_timeout 3600s;

    # ----- API（必须在 SPA location / 之前） -----
    location ^~ /api/ {
        proxy_pass http://jiada_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应：避免缓冲堆到最后才吐给客户端
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;

        # 与上游保持长连接时按需使用（部分流式场景需配合后端）
        proxy_set_header Connection "";
    }

    # ----- 用户上传资源（头像等）-----
    # Node 提供静态目录 /uploads/avatars；使用 ^~ 避免被 SPA try_files 吞掉
    location ^~ /uploads/ {
        proxy_pass http://jiada_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- 导出文件等静态下载（可选；避免被 SPA try_files 吞掉） -----
    # location ^~ /exports/ {
    #     proxy_pass http://jiada_files;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ----- 前端 SPA -----
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/your.domain.com.log;
    error_log /www/wwwlogs/your.domain.com.error.log;
}

