# 宝塔站点专用（宿主机 Nginx / OpenResty）
# 容器内 gateway 配置勿用本文件 → 见 deploy/nginx/default.conf
# 说明 → docs/nginx/部署说明.md

upstream jiada_gateway {
    server 127.0.0.1:18081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name train.jiuanci.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name train.jiuanci.com;

    ssl_certificate     /www/server/panel/vhost/cert/train.jiuanci.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/train.jiuanci.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 250m;
    send_timeout 3600s;

    location / {
        proxy_pass http://jiada_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_set_header Connection "";
    }

    access_log /www/wwwlogs/train.jiuanci.com.log;
    error_log /www/wwwlogs/train.jiuanci.com.error.log;
}
